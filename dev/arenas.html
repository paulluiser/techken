<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Techken · Arena sheet (dev only)</title>
<style>body{margin:0;background:#111;color:#ddd;font:13px ui-monospace,monospace;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(384px,1fr));gap:8px}canvas{width:100%;image-rendering:pixelated;display:block}</style></head>
<body><script type="module">
import { arenaArt } from "/src/render/art/arenas.ts";
import { ARENAS } from "/src/sim/arenas.ts";
ARENAS.forEach((a, i) => {
  const art = arenaArt(i), c = document.createElement("canvas"); c.width = 384; c.height = 216;
  const g = c.getContext("2d"); g.drawImage(art.bg, 0, 0); for (const p of art.platforms) g.drawImage(p.img, p.x, p.y);
  const d = document.createElement("div"); d.textContent = a.name; d.appendChild(c); document.body.appendChild(d);
});
</script></body></html>
