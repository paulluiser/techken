<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techken · Duo test (dev only)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05060a; color: #e9e4d4; font: 16px/1.3 ui-monospace, monospace; }
    header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: calc(100% - 46px); padding: 0 6px 6px; box-sizing: border-box; }
    iframe { width: 100%; height: 100%; border: 2px solid #2a3242; background: #000; }
    label { display: inline-flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <b>Duo test</b> host (left) and guest (right) in one window, so neither tab gets paused.
    <label><input type="checkbox" id="auto" checked> autoplay both</label>
    <button id="go">Restart</button>
    <span id="st"></span>
  </header>
  <main><iframe id="a" title="Host"></iframe><iframe id="b" title="Guest"></iframe></main>
  <script>
    const a = document.getElementById("a"), b = document.getElementById("b"), st = document.getElementById("st");
    const bc = new BroadcastChannel("techken-dev");
    const autoQ = () => (document.getElementById("auto").checked ? "&auto=1" : "");
    bc.onmessage = (e) => {
      if (!e.data || !e.data.code) return;
      st.textContent = "code " + e.data.code + ", guest joining…";
      b.src = "/?autopick=1&code=" + e.data.code + autoQ();
    };
    function go() { st.textContent = "host creating meeting…"; b.src = "about:blank"; a.src = "/?host=1&autopick=1" + autoQ(); }
    document.getElementById("go").onclick = go;
    go();
  </script>
</body>
</html>
