<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Techken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
</head>
<body>
  <div id="app">
    <div id="game" aria-label="Game screen"></div>
    <div id="crt" hidden></div>

    <div id="touch" hidden>
      <div class="pad left" id="pad-move">
        <button data-bit="1" aria-label="Move left">◀</button>
        <button data-bit="8" aria-label="Down / drop through">▼</button>
        <button data-bit="2" aria-label="Move right">▶</button>
      </div>
      <div class="pad right" id="pad-act">
        <div class="skills">
          <button data-bit="128" class="small" aria-label="Skill 1">S1</button>
          <button data-bit="256" class="small" aria-label="Skill 2">S2</button>
          <button data-bit="512" class="small" aria-label="Skill 3">S3</button>
        </div>
        <div class="main">
          <button data-bit="64" class="small" aria-label="Guard">GRD</button>
          <button data-bit="32" class="small" aria-label="Dash">DASH</button>
          <button data-bit="4" class="small" aria-label="Jump">JUMP</button>
          <button data-bit="16" class="attack" aria-label="Attack, hold to charge">ATK</button>
        </div>
      </div>
      <div id="touch-edit" hidden>
        <p>Drag the two button groups where you want them.</p>
        <button class="btn primary" id="touch-done">DONE</button>
      </div>
    </div>

    <pre id="debug" hidden></pre>
    <button id="menu-btn" class="chip" hidden aria-label="Menu">MENU</button>
    <div id="toast" hidden></div>

    <!-- every window is rendered into #ui by src/ui code -->
    <div id="ui"></div>

    <div id="rotate">Rotate your phone to landscape</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
