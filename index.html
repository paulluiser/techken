<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Techken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Lilita+One&display=swap">
</head>
<body>
  <div id="app">
    <div id="game" aria-label="Game screen"></div>
    
    <div id="touch" hidden>
      <div id="pad-move"><div id="stick-zone" aria-label="Move: touch and drag"><div id="stick" hidden><div class="knob"></div></div></div></div>
      <div class="pad right" id="pad-act">
        <button class="tb skill s1" data-skill="0" aria-label="Skill 1"><span class="lbl">1</span><span class="cdt"></span></button>
        <button class="tb skill s2" data-skill="1" aria-label="Skill 2"><span class="lbl">2</span><span class="cdt"></span></button>
        <button class="tb skill s3" data-skill="2" aria-label="Skill 3"><span class="lbl">3</span><span class="cdt"></span></button>
        <button class="tb attack" data-act="attack" aria-label="Attack: hold to charge, drag to aim">ATK</button>
        <button class="tb dash" data-act="dash" aria-label="Dash">DASH</button>
      </div>
      <div id="touch-edit" hidden>
        <p>Drag the buttons where you want them.</p>
        <button class="btn primary" id="touch-done">DONE</button>
      </div>
    </div>

    <pre id="debug" hidden></pre>
    <button id="menu-btn" class="chip" hidden aria-label="Menu">MENU</button>
    <div id="toast" hidden></div>

    <!-- every window is rendered into #ui by src/ui code -->
    <div id="ui"></div>

    <div id="rotate">Rotate your phone to landscape</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
